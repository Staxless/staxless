name: "staxless"

x-kong-config:
  &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-off}

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

services:
  frontend:
    image: app_frontend
    build:
      context: ../frontend/
      dockerfile: ../config/dockerfiles/frontend.Dockerfile
      target: dev
    ports:
      - "3000:3000"
    expose:
      - "3000"
    restart: always
    volumes:
      - ../frontend/src/:/app/src
      - /app/node_modules
      - /app/.next
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    environment:
      - NODE_ENV=development
      - NEXT_WEBPACK_USEPOLLING=1
    networks:
      frontend:
        aliases:
          - "frontend"
      backend:
        aliases:
          - "frontend"


  kong-api-gateway:
      image: "${KONG_DOCKER_TAG:-kong:latest}"
      user: "${KONG_USER:-kong}"
      env_file:
        - ../config/secrets/dev/staxless.dev.env
      environment:
        <<: *kong-env
        KONG_ADMIN_ACCESS_LOG: /dev/stdout
        KONG_ADMIN_ERROR_LOG: /dev/stderr
        KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000}"
        KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
        KONG_ADMIN_GUI_LISTEN: "${KONG_ADMIN_GUI_LISTEN:-0.0.0.0:8002}"
        KONG_PROXY_ACCESS_LOG: /dev/stdout
        KONG_PROXY_ERROR_LOG: /dev/stderr
        KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
        KONG_DECLARATIVE_CONFIG: "/opt/kong/src/kong.yaml"
        KONG_PLUGINS: "bundled,rbac-auth"                    
        KONG_LUA_PACKAGE_PATH: "/opt/kong/plugins/?.lua;;"    
      ports:
        - '${KONG_INBOUND_PROXY_LISTEN:-0.0.0.0}:8000:8000/tcp'
        - '${KONG_INBOUND_SSL_PROXY_LISTEN:-0.0.0.0}:8443:8443/tcp'
        - '8001:8001/tcp'
        - '8444:8444/tcp'
        - '8002:8002/tcp'
      expose:
        - "8001"
        - "8002"
        - "8444"
      healthcheck:
        test: ["CMD", "kong", "health"]
        interval: 10s
        timeout: 10s
        retries: 10
      restart: on-failure:5
      read_only: true
      volumes:
        - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
        - kong_tmp_vol:/tmp
        - ../kong-gateway/src/kong.yaml:/opt/kong/src/kong.yaml
        - ../kong-gateway/plugins/rbac-auth:/usr/local/share/lua/5.1/kong/plugins/rbac-auth                   
      security_opt:
        - no-new-privileges
      networks:
        frontend:
          aliases:
            - "front-gate"
        backend:
          aliases:
            - "back-gate"

  mongodb-service:
    image: mongo:latest
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "27017:27017"
    expose:
      - "27017"
    restart: always
    logging:
      options:
        max-size: 1g
    command: mongod --quiet --logpath /dev/null
    networks:
      backend:
        aliases:
          - "mongo"

  auth-service:
    image: app_auth_service
    build:
      context: ../microservices/auth-service/
      dockerfile: ../../config/dockerfiles/auth-service.Dockerfile
      target: dev
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "8080:8080"
    expose:
      - "8080"
    volumes:
      - ../microservices/auth-service/src:/home/node/src
      - ../microservices/auth-service/src/server.js:/home/node/server.js
    environment:
      - NODE_ENV=development
    networks:
      backend:
        aliases:
          - "auth"

  user-service:
    image: app_user_service
    build:
      context: ../microservices/user-service/
      dockerfile: ../../config/dockerfiles/user-service.Dockerfile
      target: dev
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "8082:8082"
    expose:
      - "8082"
    volumes:
      - ../microservices/user-service/src:/home/node/src
      - ../microservices/user-service/src/server.js:/home/node/server.js
    environment:
      - NODE_ENV=development
    networks:
      backend:
        aliases:
          - "user"

  stripe-service:
    build:
      context: ../microservices/stripe-service/
      dockerfile: ../../config/dockerfiles/stripe-service.Dockerfile
      target: dev
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "8083:8083"
    expose:
      - "8083"
    volumes:
      - ../microservices/stripe-service/src:/home/node/src
      - ../microservices/stripe-service/src/server.js:/home/node/server.js
    environment:
      - NODE_ENV=development
    networks:
      backend:
        aliases:
          - "stripe"

  email-service:
    image: app_email_service

    build:
      context: ../microservices/email-service/
      dockerfile: ../../config/dockerfiles/email-service.Dockerfile
      target: dev
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "8084:8084"
    expose:
      - "8084"
    volumes:
      - ../microservices/email-service/src:/home/node/src
      - ../microservices/email-service/src/server.js:/home/node/server.js
    environment:
      - NODE_ENV=development
    networks:
      backend:
        aliases:
          - "email"

  cms-service:
    image: node:18-alpine
    env_file:
      - ../config/secrets/dev/staxless.dev.env
    ports:
      - "8085:8085"
    expose:
      - "8085"
    volumes:
      - ../microservices/cms-service:/home/node/app
      - ../microservices/cms-service/node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - mongodb-service
    environment:
      - PORT=8085
    networks:
      backend:
        aliases:
          - "cms"

networks:
  backend:
    name: backend
    driver: bridge
  frontend:
    name: frontend
    driver: bridge