name: "staxless"

x-kong-config:
  &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-off}

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

services:
  frontend:
    image: app_frontend
    container_name: frontend
    build:
      context: ../frontend/
      dockerfile: ./dockerfiles/frontend.Dockerfile
      target: dev
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ../frontend/src/:/app/src
      - /app/node_modules
      - /app/.next
    environment:
      - "NEXT_WEBPACK_USEPOLLING=1"
    networks:
      frontend:
        aliases:
          - "frontend"
      backend:
        aliases:
          - "frontend"

  kong-api-gateway:
    image: "${KONG_DOCKER_TAG:-kong:latest}"
    user: "${KONG_USER:-kong}"
    container_name: kong
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
      KONG_ADMIN_GUI_LISTEN: "${KONG_ADMIN_GUI_LISTEN:-0.0.0.0:8002}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yaml"
    ports:
      - "${KONG_INBOUND_PROXY_LISTEN:-0.0.0.0}:8000:8000/tcp"
      - "${KONG_INBOUND_SSL_PROXY_LISTEN:-0.0.0.0}:8443:8443/tcp"
      - "8001:8001/tcp"
      - "8444:8444/tcp"
      - "8002:8002/tcp"
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    read_only: true
    volumes:
      - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      - kong_tmp_vol:/tmp
      - ../kong-gateway/:/opt/kong
    security_opt:
      - no-new-privileges
    networks:
      frontend:
        aliases:
          - "front-gate"
      backend:
        aliases:
          - "back-gate"

  mongodb-service:
    image: mongo:latest
    container_name: mongodb-service
    ports:
      - "27017:27017"
    restart: always
    logging:
      options:
        max-size: 1g
    command: mongod --quiet --logpath /dev/null
    networks:
      backend:
        aliases:
          - "mongo"

  auth-service:
    image: app_auth_service
    container_name: auth-service
    build:
      context: ../microservices/auth-service/
      dockerfile: ./dockerfiles/auth-service.Dockerfile
      target: dev
    env_file:
      - ../microservices/auth-service/secrets/.env
    ports:
      - "8080:8080"
    volumes:
      - ../microservices/auth-service/src:/home/node/src
      - ../microservices/auth-service/src/server.js:/home/node/server.js
    networks:
      backend:
        aliases:
          - "auth"

  user-service:
    image: app_user_service
    container_name: user-service
    build:
      context: ../microservices/user-service/
      dockerfile: ./dockerfiles/user-service.Dockerfile
      target: dev
    env_file:
      - ../microservices/user-service/secrets/.env
    ports:
      - "8082:8082"
    volumes:
      - ../microservices/user-service/src:/home/node/src
      - ../microservices/user-service/src/server.js:/home/node/server.js
    expose:
      - "8082"
    networks:
      backend:
        aliases:
          - "user"

  stripe-service:
    container_name: stripe-service
    build:
      context: ../microservices/stripe-service/
      dockerfile: ./dockerfiles/stripe-service.Dockerfile
      target: dev
    ports:
      - "8083:8083"
    env_file:
      - ../microservices/stripe-service/secrets/.env
    volumes:
      - ../microservices/stripe-service/src:/home/node/src
      - ../microservices/stripe-service/src/server.js:/home/node/server.js
    networks:
      backend:
        aliases:
          - "stripe"

networks:
  backend:
    name: backend
    driver: bridge
  frontend:
    name: frontend
    driver: bridge