name: "staxless"

x-kong-config:
  &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-off}

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_gateway: {}
  mongo_data: {}

services:
  frontend:
    image: app_frontend
    build:
      context: ../frontend/
      dockerfile: ../config/dockerfiles/frontend.Dockerfile
      target: prod
    expose:
      - "3000"
    restart: always
    env_file:
      - ../../secrets/prod/frontend.env
    environment:
      - NODE_ENV=production
    networks:
      frontend:
        aliases:
          - "frontend"
      backend:
        aliases:
          - "frontend"

  kong-api-gateway:
    image: "${KONG_DOCKER_TAG:-kong:latest}"
    user: "${KONG_USER:-kong}"
    env_file:
      - ../../secrets/prod/kong.env
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
      KONG_ADMIN_GUI_LISTEN: "${KONG_ADMIN_GUI_LISTEN:-0.0.0.0:8002}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yaml"
    expose:
      - "8001"
      - "8002"
      - "8444"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    read_only: true
    volumes:
      - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      - kong_tmp_vol:/tmp
      - kong_gateway:/opt/kong
    security_opt:
      - no-new-privileges
    networks:
      frontend:
        aliases:
          - "front-gate"
      backend:
        aliases:
          - "back-gate"

  mongodb-service:
    image: mongo:latest
    env_file:
      - ../../secrets/prod/mongodb.env
    expose:
      - "27017"
    restart: always
    volumes:
      - mongo_data:/data/db
    logging:
      options:
        max-size: 1g
    command: mongod --quiet --logpath /dev/null
    networks:
      backend:
        aliases:
          - "mongo"

  auth-service:
    image: app_auth_service
    build:
      context: ../microservices/auth-service/
      dockerfile: ../../config/dockerfiles/auth-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/auth-service.env
    expose:
      - "8080"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      backend:
        aliases:
          - "auth"

  user-service:
    image: app_user_service
    build:
      context: ../microservices/user-service/
      dockerfile: ../../config/dockerfiles/user-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/user-service.env
    expose:
      - "8082"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      backend:
        aliases:
          - "user"

  stripe-service:
    build:
      context: ../microservices/stripe-service/
      dockerfile: ../../config/dockerfiles/stripe-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/stripe-service.env
    expose:
      - "8083"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      backend:
        aliases:
          - "stripe"

  email-service:
    image: app_email_service
    build:
      context: ../microservices/email-service/
      dockerfile: ../../config/dockerfiles/email-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/email-service.env
    expose:
      - "8084"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      backend:
        aliases:
          - "email"

  cms-service:
    image: node:18-alpine
    env_file:
      - ../../secrets/prod/cms-service.env
    expose:
      - "8085"
    restart: always
    environment:
      - NODE_ENV=production
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm start"
    networks:
      backend:
        aliases:
          - "cms"

networks:
  backend:
    name: backend
    driver: bridge
  frontend:
    name: frontend
    driver: bridge