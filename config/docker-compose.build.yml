services:
  frontend:
    image: ghcr.io/staxless/staxless/frontend:latest
    build:
      context: ../frontend/
      dockerfile: ../config/dockerfiles/frontend.Dockerfile
      target: prod
      platforms:
        - linux/amd64

  auth-service:
    image: ghcr.io/staxless/staxless/auth-service:latest
    build:
      context: ../microservices/auth-service/
      dockerfile: ../../config/dockerfiles/node-service.Dockerfile
      target: prod
      platforms:
        - linux/amd64

  user-service:
    image: ghcr.io/staxless/staxless/user-service:latest
    build:
      context: ../microservices/user-service/
      dockerfile: ../../config/dockerfiles/node-service.Dockerfile
      target: prod
      platforms:
        - linux/amd64

  stripe-service:
    image: ghcr.io/staxless/staxless/stripe-service:latest
    build:
      context: ../microservices/stripe-service/
      dockerfile: ../../config/dockerfiles/node-service.Dockerfile
      target: prod
      platforms:
        - linux/amd64

  email-service:
    image: ghcr.io/staxless/staxless/email-service:latest
    build:
      context: ../microservices/email-service/
      dockerfile: ../../config/dockerfiles/node-service.Dockerfile
      target: prod
      platforms:
        - linux/amd64

  cms-service:
    image: ghcr.io/staxless/staxless/cms-service:latest
    build:
      context: ../microservices/cms-service/
      dockerfile: ../../config/dockerfiles/payload.Dockerfile
      target: prod
      platforms:
        - linux/amd64
        - linux/arm64

  kong-api-gateway:
    image: ghcr.io/staxless/staxless/kong:latest
    build:
      context: ../kong-gateway/
      dockerfile: ../config/dockerfiles/kong.Dockerfile
      target: prod
      platforms:
        - linux/amd64
        - linux/arm64
