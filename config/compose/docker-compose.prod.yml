name: "staxless"

x-kong-config: &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-off}

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_gateway: {}
  mongo_data: {}
  zookeeper_data: {}
  zookeeper_log: {}
  kafka_data: {}
  kafka_logs: {}

networks:
  backend:
    name: backend
    driver: bridge
  frontend:
    name: frontend
    driver: bridge

services:
  frontend:
    image: app_frontend
    build:
      context: ../frontend/
      dockerfile: ../config/dockerfiles/frontend.Dockerfile
      target: prod
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - ../../secrets/prod/frontend.env
    environment:
      NODE_ENV: production
    networks:
      frontend:
        aliases: ["frontend"]
      backend:
        aliases: ["frontend"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  kong-api-gateway:
    image: "${KONG_DOCKER_TAG:-kong:3.6}"
    user: "${KONG_USER:-kong}"
    env_file:
      - ../../secrets/prod/kong.env
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
      KONG_ADMIN_GUI_LISTEN: "${KONG_ADMIN_GUI_LISTEN:-0.0.0.0:8002}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yaml"
      KONG_PLUGINS: "bundled,rbac-auth"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8002:8002"
      - "8444:8444"
    restart: on-failure:5
    read_only: true
    volumes:
      - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      - kong_tmp_vol:/tmp
      - kong_gateway:/opt/kong
      - ../kong-gateway/src/kong.yaml:/opt/kong/kong.yaml:ro
      - ../kong-gateway/plugins/rbac-auth:/usr/local/share/lua/5.1/kong/plugins/rbac-auth:ro
    networks:
      frontend:
        aliases: ["front-gate"]
      backend:
        aliases: ["back-gate"]
    depends_on:
      - auth-service
      - email-service
      - stripe-service
      - user-service
      - cms-service
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges

  mongodb-service:
    image: mongo:7.0
    env_file:
      - ../../secrets/prod/mongodb.env
    expose:
      - "27017"
    restart: always
    command: mongod --quiet --logpath /dev/null
    volumes:
      - mongo_data:/data/db
    networks:
      backend:
        aliases: ["mongo"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''db.adminCommand("ping").ok'' | grep 1 >/dev/null || exit 1',
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      options:
        max-size: "1g"

  auth-service:
    image: app_auth_service
    build:
      context: ../microservices/auth-service/
      dockerfile: ../../config/dockerfiles/auth-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/auth-service.env
    expose:
      - "8080"
    restart: always
    environment:
      NODE_ENV: production
    networks:
      backend:
        aliases: ["auth"]
    depends_on:
      mongodb-service:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    image: app_user_service
    build:
      context: ../microservices/user-service/
      dockerfile: ../../config/dockerfiles/user-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/user-service.env
    expose:
      - "8082"
    restart: always
    environment:
      NODE_ENV: production
    networks:
      backend:
        aliases: ["user"]
    depends_on:
      mongodb-service:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  stripe-service:
    image: app_stripe_service
    build:
      context: ../microservices/stripe-service/
      dockerfile: ../../config/dockerfiles/stripe-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/stripe-service.env
    expose:
      - "8083"
    restart: always
    environment:
      NODE_ENV: production
    networks:
      backend:
        aliases: ["stripe"]
    depends_on:
      mongodb-service:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  email-service:
    image: app_email_service
    build:
      context: ../microservices/email-service/
      dockerfile: ../../config/dockerfiles/email-service.Dockerfile
      target: prod
    env_file:
      - ../../secrets/prod/email-service.env
    expose:
      - "8084"
    restart: always
    environment:
      NODE_ENV: production
    networks:
      backend:
        aliases: ["email"]
    depends_on:
      mongodb-service:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  cms-service:
    image: node:18-alpine
    env_file:
      - ../../secrets/prod/cms-service.env
    expose:
      - "8085"
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8085
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm start"
    networks:
      backend:
        aliases: ["cms"]
    depends_on:
      mongodb-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SNAPSHOT_TRUST_EMPTY: "true"
    restart: always
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      backend:
        aliases: ["zookeeper"]

  kafka-service:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: always
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_logs:/var/log/kafka
    expose:
      - "29092"
    networks:
      backend:
        aliases: ["kafka"]

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka-service:
        condition: service_healthy
    command: >
      bash -c "
        cub kafka-ready -b kafka:29092 1 30 &&
        for topic in auth-events email-events payment-events user-events session-validation-replies; do
          kafka-topics --create --topic $$topic --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists;
        done
      "
    restart: "no"
    networks:
      - backend
