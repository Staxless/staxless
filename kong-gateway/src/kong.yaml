upstreams:
  - name: auth-upstream
    targets:
      - target: auth:8080
    healthchecks:
      active:
        type: http
        http_path: /health
        headers: {}
        healthy:
          interval: 10
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 5

  - name: stripe-upstream
    targets:
      - target: stripe:8083
    healthchecks:
      active:
        type: http
        http_path: /health
        headers: {}
        healthy:
          interval: 10
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 5
  
  - name: mailgun-upstream
    targets:
      - target: mailgun:8084
    healthchecks:
      active:
        type: http
        http_path: /health
        headers: {}
        healthy:
          interval: 10
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 5