_format_version: "2.1"

services:
  - name: auth
    url: http://auth:8080
    routes:
      - name: oauth-providers
        methods: [GET]
        paths: [/oauth/providers]
        strip_path: false        

      - name: oauth-register
        methods: [GET]
        paths: [/oauth/register/(.+)]
        strip_path: false        

      - name: oauth-login
        methods: [GET]
        paths: [/oauth/login/(.+)]
        strip_path: false        
        plugins:
          - name: request-transformer
            config:
              add:
                headers:
                  - Cookie:${request.headers.cookie}
                  - x-user-info:${request.headers.x-user-info}

      - name: oauth-callback
        methods: [GET]
        paths: [/oauth/(.+)/callback]
        strip_path: false        

      - name: magicLink-register
        methods: [POST]
        paths: [/auth/magic-link/register]
        strip_path: false        

      - name: magicLink-login
        methods: [POST]
        paths: [/auth/magic-link/login]
        strip_path: false 

      - name: magicLink-callback
        methods: [GET]
        paths: [/auth/magic-link/callback]
        strip_path: false    

      - name: auth-logout
        methods: [POST]
        paths: [/auth/logout]
        strip_path: false

      - name: auth-validate-request
        methods: [POST]
        paths: [/auth/validate-request]
        strip_path: false

  - name: stripe
    url: http://stripe:8083
    routes:
      - name: checkout
        methods: [POST]
        paths: [/checkout]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              add:
                headers:
                  - Content-Type:application/json
                  - x-user-info:${request.headers.x-user-info}

      - name: webhook
        methods: [POST, GET]
        paths: [/webhook]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              http_method: null
              add:
                headers:
                  - x-user-info:${request.headers.x-user-info}
                  - stripe-signature:${request.headers.stripe-signature}
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
              headers:
                - Content-Type
                - x-user-info
                - stripe-signature
              exposed_headers:
                - Content-Type
                - x-user-info
                - stripe-signature
              credentials: true
              max_age: 3600

      - name: products
        methods: [GET]
        paths: [/products]
        strip_path: false 

  - name: mailgun
    url: http://mailgun:8084
    routes:
      - name: send-email
        methods: [POST]
        paths: [/send-email]
        strip_path: false   

  - name: cms
    url: http://cms:8085
    routes:
    routes:
      - name: cms-admin-route
        paths:
          - /admin
        strip_path: true
        preserve_host: true



