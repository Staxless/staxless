# KrakenD API Gateway Configuration

# JSON Schema reference
$schema: https://www.krakend.io/schema/krakend.json

# KrakenD version
version: 3

# API Gateway name
name: KrakenD - API Gateway

# Extra configurations for security and CORS
extra_config:
  security/cors:
    allow_origins:
      - "*" # Allow requests from any origin
    expose_headers:
      - Content-Length
    max_age: 12h # CORS preflight cache duration
    allow_methods:
      - GET
      - POST
    router:
      return_error_msg: true # Return error messages
      auto_options: true # Automatically respond to OPTIONS requests

# Timeout settings for backend requests
timeout: 3000ms

# Cache Time-To-Live (TTL) for responses
cache_ttl: 300s

# API Endpoints Configuration
endpoints:
  - endpoint: /auth/login/{provider} # Login endpoint
    method: GET
    output_encoding: no-op # No encoding for output
    headers_to_pass:
      - Content-Type
      - Authorization # Pass Content-Type and Authorization headers
    extra_config:
      github.com/devopsfaith/krakend/proxy:
        http_proxy:
          request_headers:
            Content-Type: application/json # Set Content-Type for proxy request
          response_headers:
            Set-Cookie: "*" # Set Cookie header in response
    backend:
      - url_pattern: /auth/login/{provider} # Backend URL pattern for login
        encoding: no-op
        method: GET
        host:
          - http://auth-service:8000 # Backend host for login

  - endpoint: /auth/logout # Logout endpoint
    method: POST
    output_encoding: no-op # No encoding for output
    headers_to_pass:
      - Content-Type
      - Authorization
    extra_config:
      github.com/devopsfaith/krakend/proxy:
        http_proxy:
          request_headers:
            Content-Type: application/json # Set Content-Type for proxy request
            Cookie: "*" # Forward all cookies to the backend
          response_headers:
            Set-Cookie: "*" # Set Cookie header in response
    backend:
      - url_pattern: /auth/logout # Backend URL pattern for logout
        encoding: no-op
        method: POST
        host:
          - http://auth-service:8000 # Backend host for logout

  - endpoint: /auth/validate-request # Validate request endpoint
    method: POST
    output_encoding: json
    headers_to_pass:
      - Content-Type
      - Authorization
      - auth_session # Include Cookie header to pass cookies
    extra_config:
      github.com/devopsfaith/krakend/proxy:
        http_proxy:
          request_headers:
            Content-Type: application/json # Set Content-Type for proxy request
            Cookie: "*" # Forward all cookies to the backend
          response_headers:
            Set-Cookie: "*" # Allow setting cookies in the response
    backend:
      - url_pattern: /auth/validate-request # Backend URL pattern for token validation
        encoding: json
        method: POST
        host:
          - http://auth-service:8000 # Backend host for token validation

