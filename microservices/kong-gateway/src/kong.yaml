_format_version: "2.1"

services:
  - name: auth
    url: http://auth-upstream
    plugins:
      - name: cors
        config:
          origins:
            - "https://int.staxless.com"
            - "http://localhost:3000"
          credentials: true
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Content-Type
            - Cookie
            - X-User-Info
          exposed_headers:
            - Set-Cookie
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
          limit_by: consumer
      - name: proxy-cache
        config:
          strategy: memory
          cache_ttl: 300
    read_timeout: 10000
    write_timeout: 10000
    connect_timeout: 5000
    routes:
      - name: auth-providers
        methods:
          - GET
        paths:
          - /auth/providers
        strip_path: false
      - name: oauth-providers
        methods:
          - GET
        paths:
          - /oauth/providers
        strip_path: false
      - name: oauth-register
        methods:
          - GET
        paths:
          - /oauth/register/(.+)
        strip_path: false
      - name: oauth-login
        methods:
          - GET
        paths:
          - /oauth/login/(.+)
        strip_path: false
      - name: oauth-callback
        methods:
          - GET
        paths:
          - /oauth/(.+)/callback
        strip_path: false
      - name: magicLink-register
        methods:
          - POST
        paths:
          - /auth/magic-link/register
        strip_path: false
      - name: magicLink-login
        methods:
          - POST
        paths:
          - /auth/magic-link/login
        strip_path: false
      - name: magicLink-callback
        methods:
          - GET
        paths:
          - /auth/magic-link/callback
        strip_path: false
      - name: auth-logout
        methods:
          - POST
        paths:
          - /auth/logout
        strip_path: false
      - name: auth-validate-request
        methods:
          - POST
        paths:
          - /auth/validate-request
        strip_path: false

  - name: stripe
    url: http://stripe-upstream
    plugins:
      - name: rate-limiting
        config:
          minute: 50
          hour: 500
          policy: local
          limit_by: consumer
      - name: proxy-cache
        config:
          strategy: memory
          cache_ttl: 300
    read_timeout: 15000
    write_timeout: 15000
    connect_timeout: 5000
    routes:
      - name: checkout
        methods:
          - POST
        paths:
          - /checkout
        strip_path: false
        plugins:
          - name: rbac-auth
            config:
              auth_service_url: http://auth-service:8080
              required_roles:
                - user
          - name: request-transformer
            config:
              add:
                headers:
                  - "Content-Type:application/json"
                  - "x-user-info:${request.headers.x-user-info}"
                  - "cookie:auth_session=${request.headers.cookie.auth_session}"
      - name: webhook
        methods:
          - POST
          - GET
          - OPTIONS
        paths:
          - /webhook
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - "${FRONTEND_DOMAIN:http://localhost:3000}"
                - "https://stripe.com"
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Content-Type
                - x-user-info
                - stripe-signature
              exposed_headers:
                - Content-Type
                - x-user-info
                - stripe-signature
              credentials: true
              max_age: 3600
      - name: products
        methods:
          - GET
        paths:
          - /products
        strip_path: false
      - name: checkout-session
        methods:
          - GET
        paths:
          - /checkout/session/(.+)
        strip_path: false
        plugins:
          - name: rbac-auth
            config:
              auth_service_url: http://auth-service:8080
              required_roles:
                - user
          - name: request-transformer
            config:
              add:
                headers:
                  - "Content-Type:application/json"
                  - "x-user-info:${request.headers.x-user-info}"
                  - "cookie:auth_session=${request.headers.cookie.auth_session}"

  - name: email
    url: http://email-upstream
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          hour: 300
          policy: local
          limit_by: consumer
    read_timeout: 10000
    write_timeout: 10000
    connect_timeout: 5000
    routes:
      - name: send-email
        methods:
          - POST
        paths:
          - /email/send
        strip_path: false

  - name: user
    url: http://user-upstream
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 600
          policy: local
          limit_by: consumer
    read_timeout: 10000
    write_timeout: 10000
    connect_timeout: 5000
    routes:
      - name: user-settings
        methods:
          - GET
        paths:
          - /user/settings
        strip_path: false
        plugins:
          - name: rbac-auth
            config:
              auth_service_url: http://auth-service:8080
              required_roles:
                - user
          - name: request-transformer
            config:
              add:
                headers:
                  - "Content-Type:application/json"
                  - "x-user-info:${request.headers.x-user-info}"
                  - "cookie:auth_session=${request.headers.cookie.auth_session}"

upstreams:
  - name: auth-upstream
    targets:
      - target: auth-service:8080
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 5
        concurrency: 10
        headers: {}
        healthy:
          interval: 10
          successes: 1
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 10
          http_failures: 5
          http_statuses:
            - 429
            - 500
            - 503

  - name: stripe-upstream
    targets:
      - target: stripe-service:8083
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 5
        concurrency: 10
        headers: {}
        healthy:
          interval: 10
          successes: 1
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 10
          http_failures: 5
          http_statuses:
            - 429
            - 500
            - 503

  - name: email-upstream
    targets:
      - target: email-service:8084
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 5
        concurrency: 10
        headers: {}
        healthy:
          interval: 10
          successes: 1
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 10
          http_failures: 5
          http_statuses:
            - 429
            - 500
            - 503

  - name: user-upstream
    targets:
      - target: user-service:8082
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 5
        concurrency: 10
        headers: {}
        healthy:
          interval: 10
          successes: 1
          http_statuses:
            - 200
            - 302
        unhealthy:
          interval: 10
          http_failures: 5
          http_statuses:
            - 429
            - 500
            - 503
