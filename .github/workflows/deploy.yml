name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to update (comma-separated or "all")'
        type: string
        default: 'all'

jobs:
  update:
    uses: staxless/staxless-deploy/.github/workflows/update-services.yml@v1
    with:
      services: ${{ inputs.services || 'all' }}
    secrets: inherit
