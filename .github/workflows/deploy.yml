name: Rolling Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to update (comma-separated or "all")'
        type: string
        default: 'all'

permissions:
  contents: read
  packages: write

jobs:
  update:
    uses: staxless/staxless-deploy/.github/workflows/rolling-update.yml@v1
    with:
      services: ${{ inputs.services || 'all' }}
      auto_detect: ${{ github.event_name == 'push' }}
    secrets: inherit
