version: "3.8"

networks:
  backend:
    driver: overlay
    attachable: true
  frontend:
    driver: overlay
    attachable: true

secrets:
  CLOUDFLARE_TUNNEL_TOKEN:
    external: true
  GITHUB_CLIENT_ID:
    external: true
  GITHUB_CLIENT_SECRET:
    external: true
  GOOGLE_CLIENT_ID:
    external: true
  GOOGLE_CLIENT_SECRET:
    external: true
  GOOGLE_REDIRECT_URI:
    external: true
  MAILGUN_API_KEY:
    external: true
  PAYLOAD_SECRET:
    external: true
  STRIPE_PRIVATE_KEY:
    external: true
  STRIPE_WEBHOOK_SECRET:
    external: true
  DATABASE_URL:
    external: true
  DATABASE_NAME:
    external: true

volumes:
  kong_data:
    driver: local
  kong_prefix_vol:
    driver: local
  kong_tmp_vol:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local

x-common-environment: &common-environment
  NODE_ENV: production
  API_GATEWAY_URL: https://api.staxless.com
  FRONTEND_URL: https://int.staxless.com
  COOKIE_DOMAIN: .staxless.com

x-kafka-environment: &kafka-environment
  KAFKA_BROKERS: kafka-service:9092

x-deploy-config: &deploy-config
  mode: replicated
  replicas: 1
  restart_policy:
    condition: on-failure
    max_attempts: 5
    delay: 10s
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
  resources:
    limits:
      memory: 384M
    reservations:
      memory: 96M

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    secrets:
      - source: CLOUDFLARE_TUNNEL_TOKEN
        target: /run/secrets/CLOUDFLARE_TUNNEL_TOKEN
        uid: "65532"
        gid: "65532"
        mode: 0400
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/CLOUDFLARE_TUNNEL_TOKEN
    networks:
      - frontend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  frontend:
    image: ghcr.io/staxless/staxless/frontend:latest
    networks:
      - frontend
      - backend
    environment:
      <<: [*common-environment]
      PORT: 3000
      HOST: 0.0.0.0
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      disable: true

  kong-api-gateway:
    image: ghcr.io/staxless/staxless/kong:latest
    ulimits:
      nofile:
        soft: 4096
        hard: 524288
    environment:
      <<: [*common-environment]
      KONG_DATABASE: "off"
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yaml"
      KONG_PLUGINS: "bundled,rbac-auth"
    networks:
      - frontend
      - backend
    volumes:
      - kong_prefix_vol:/var/run/kong
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-service:
    image: ghcr.io/staxless/staxless/auth-service:latest
    secrets:
      - source: GITHUB_CLIENT_ID
        target: /run/secrets/GITHUB_CLIENT_ID
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: GITHUB_CLIENT_SECRET
        target: /run/secrets/GITHUB_CLIENT_SECRET
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: GOOGLE_CLIENT_ID
        target: /run/secrets/GOOGLE_CLIENT_ID
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: GOOGLE_CLIENT_SECRET
        target: /run/secrets/GOOGLE_CLIENT_SECRET
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: GOOGLE_REDIRECT_URI
        target: /run/secrets/GOOGLE_REDIRECT_URI
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: DATABASE_NAME
        target: /run/secrets/DATABASE_NAME
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: DATABASE_URL
        target: /run/secrets/DATABASE_URL
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    environment:
      <<: [*common-environment, *kafka-environment]
    deploy:
      <<: *deploy-config
    healthcheck:
      disable: true

  user-service:
    image: ghcr.io/staxless/staxless/user-service:latest
    secrets:
      - source: DATABASE_NAME
        target: /run/secrets/DATABASE_NAME
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: DATABASE_URL
        target: /run/secrets/DATABASE_URL
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    environment:
      <<: [*common-environment, *kafka-environment]
    deploy:
      <<: *deploy-config
    healthcheck:
      disable: true

  stripe-service:
    image: ghcr.io/staxless/staxless/stripe-service:latest
    secrets:
      - source: STRIPE_PRIVATE_KEY
        target: /run/secrets/STRIPE_PRIVATE_KEY
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: STRIPE_WEBHOOK_SECRET
        target: /run/secrets/STRIPE_WEBHOOK_SECRET
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    environment:
      <<: [*common-environment, *kafka-environment]
    deploy:
      <<: *deploy-config
    healthcheck:
      disable: true

  email-service:
    image: ghcr.io/staxless/staxless/email-service:latest
    secrets:
      - source: MAILGUN_API_KEY
        target: /run/secrets/MAILGUN_API_KEY
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - backend
    environment:
      <<: [*common-environment, *kafka-environment]
      MAILGUN_DOMAIN: "sandboxc84e20d8cf4941c0b1fc96e8f3af303f.mailgun.org"
      MAILGUN_FROM_NAME: "Mailgun Sandbox"
      MAILGUN_FROM_EMAIL: "postmaster@sandboxc84e20d8cf4941c0b1fc96e8f3af303f.mailgun.org"
    deploy:
      <<: *deploy-config
    healthcheck:
      disable: true



  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      - backend
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  kafka-service:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - backend
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 30000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 30000
    volumes:
      - kafka_data:/var/lib/kafka/data
    extra_hosts:
      - "kafka-service:127.0.0.1"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - backend
    command: >
      bash -c "
      for i in {1..30}; do
        if getent hosts kafka-service > /dev/null 2>&1; then
          break;
        fi;
        sleep 2;
      done &&
      cub kafka-ready -b kafka-service:9092 1 120 &&
      kafka-topics --create --if-not-exists --topic auth-events --bootstrap-server kafka-service:9092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic email-events --bootstrap-server kafka-service:9092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic payment-events --bootstrap-server kafka-service:9092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic user-events --bootstrap-server kafka-service:9092 --partitions 1 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --topic session-validation-replies --bootstrap-server kafka-service:9092 --partitions 1 --replication-factor 1 &&
      kafka-topics --list --bootstrap-server kafka-service:9092 &&
      sleep 3600
      "
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
